name: CI

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

# Un commit nuevo en un pull request cancela la ejecución anterior del mismo
# PR, que ya quedó obsoleta. En develop no se cancela: cada merge se valida.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Las capas quedan en la caché de GitHub Actions: el pip install con torch
      # (unos 3,5 GB con las librerías CUDA) solo se repite si cambia
      # requirements.txt, en vez de descargarse en cada ejecución.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: priorizai-backend
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend

      - name: Ruff
        run: docker run --rm priorizai-backend ruff check .

      - name: Black
        run: docker run --rm priorizai-backend black --check .

      - name: Mypy
        run: docker run --rm priorizai-backend mypy .

      - name: Pytest
        run: |
          mkdir -p coverage
          docker run --rm \
            -v "${{ github.workspace }}/coverage:/app/coverage" \
            priorizai-backend \
            pytest --cov-report=xml:coverage/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/coverage.xml
          if-no-files-found: warn

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: priorizai-frontend
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend

      - name: Frontend lint
        run: docker run --rm priorizai-frontend npm run lint

      # Vitest borra y recrea coverage/, así que no puede ser el punto de
      # montaje: se monta otra ruta y el reporte se copia al terminar.
      - name: Frontend tests
        run: |
          mkdir -p frontend-coverage
          docker run --rm \
            -v "${{ github.workspace }}/frontend-coverage:/reportes" \
            priorizai-frontend \
            sh -c 'npm run test:coverage; estado=$?; cp -r coverage/. /reportes/; exit $estado'

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-coverage/
          if-no-files-found: warn

      - name: Frontend build
        run: docker run --rm priorizai-frontend npm run build

  # Despliega el sistema completo en un ambiente QA desechable dentro del
  # runner (docker-compose.qa.yml) y corre contra él las pruebas E2E y de carga.
  # Corre en paralelo con backend-quality: esperarlo duplicaba el tiempo total
  # del pipeline.
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker-compose.qa.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mismas imágenes que docker-compose.qa.yml, construidas con caché.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: priorizai-backend
          load: true
          cache-from: type=gha,scope=backend

      - name: Build QA frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          build-args: API_URL=http://backend:8000
          tags: priorizai-qa-frontend
          load: true
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,scope=frontend-prod

      - name: Build fake model service image
        uses: docker/build-push-action@v6
        with:
          context: ./qa/modelos-falsos
          tags: priorizai-qa-modelos-falsos
          load: true
          cache-from: type=gha,scope=modelos-falsos
          cache-to: type=gha,scope=modelos-falsos

      - name: Deploy QA environment
        run: $COMPOSE up -d --no-build --wait --wait-timeout 300

      - name: E2E tests
        run: $COMPOSE run --rm -e CI=true e2e

      - name: Load tests
        run: |
          mkdir -p qa/carga/resultados
          $COMPOSE run --rm carga

      - name: QA environment logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200 backend frontend modelos-falsos

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: qa/e2e/reportes/
          if-no-files-found: warn

      - name: Upload load test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-summary
          path: qa/carga/resultados/
          if-no-files-found: warn

      - name: Tear down QA environment
        if: always()
        run: $COMPOSE --profile pruebas down -v --remove-orphans

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            zricethezav/gitleaks:v8.28.0 \
            git . --config .gitleaks.toml --redact --no-banner --verbose

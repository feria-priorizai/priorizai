services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: priorizai_backend
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: priorizai_frontend
      ports:
        - "3000:3000"
      volumes:
        - ./frontend:/app
        - /app/node_modules
        - /app/.next
      environment:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        WATCHPACK_POLLING: "true"
      depends_on:
        - backend

  postgres:
    image: postgres:16
    container_name: priorizai_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

# Ambiente de pruebas (QA): el sistema completo, compilado como en producción,
# con PostgreSQL vacío y un servicio de modelos falso con reglas fijas.
#
# Lo usan las pruebas E2E (Playwright) y de carga (k6), en local y en el CI:
#
#   docker compose -f docker-compose.qa.yml up -d --build --wait
#   docker compose -f docker-compose.qa.yml run --rm e2e
#   docker compose -f docker-compose.qa.yml run --rm carga
#   docker compose -f docker-compose.qa.yml down -v
#
# Todas las credenciales son de prueba y solo existen dentro de este ambiente.
# Los datos son sintéticos (qa/e2e/datos): nunca cargar datos reales de pacientes.

x-credenciales-qa: &credenciales-qa
  ADMIN_ALIAS: qa-admin
  ADMIN_PASSWORD: qa-admin-inicial-2026
  ADMIN_PASSWORD_NUEVA: qa-admin-definitiva-2026

name: priorizai-qa

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: priorizai_qa
      POSTGRES_PASSWORD: qa-postgres-2026
      POSTGRES_DB: priorizai_qa
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priorizai_qa -d priorizai_qa"]
      interval: 3s
      timeout: 3s
      retries: 20

  modelos-falsos:
    build: ./qa/modelos-falsos
    environment:
      MODEL_SERVICE_API_KEY: qa-modelos-2026
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      modelos-falsos:
        condition: service_healthy
    environment:
      <<: *credenciales-qa
      # DEBUG=false como en producción: el backend no arranca si alguna
      # credencial quedó en el valor de ejemplo.
      DEBUG: "false"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: priorizai_qa
      DATABASE_USER: priorizai_qa
      DATABASE_PASSWORD: qa-postgres-2026
      ADMIN_NOMBRE: Administrador QA
      CORS_ORIGINS: http://frontend:3000
      COOKIE_SECURE: "false"
      MODEL_SERVICE_URL: http://modelos-falsos:8080
      MODEL_SERVICE_API_KEY: qa-modelos-2026
      MODEL_SERVICE_TIMEOUT: 30
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 3100 para no chocar con el ambiente de desarrollo (3000).
      - "3100:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 3s
      timeout: 3s
      retries: 40

  # --- Pruebas: solo corren con `docker compose run` ---

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["pruebas"]
    working_dir: /e2e
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      <<: *credenciales-qa
      BASE_URL: http://frontend:3000
      CI: ${CI:-}
    volumes:
      - ./qa/e2e:/e2e
      - /e2e/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

  carga:
    image: grafana/k6:1.3.0
    profiles: ["pruebas"]
    # El resumen se escribe en el volumen montado, que en el runner del CI es
    # de otro usuario que el de la imagen.
    user: root
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      <<: *credenciales-qa
      BASE_URL: http://frontend:3000
    volumes:
      - ./qa/carga:/scripts
    command: run --quiet /scripts/carga.js

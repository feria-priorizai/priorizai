name: CI

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: priorizai_user
          POSTGRES_PASSWORD: priorizai_password
          POSTGRES_DB: priorizai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priorizai_user -d priorizai_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t priorizai-backend ./backend

      - name: Ruff
        run: docker run --rm priorizai-backend ruff check .

      - name: Black
        run: docker run --rm priorizai-backend black --check .

      - name: Mypy
        run: docker run --rm priorizai-backend mypy .

      - name: Pytest
        run: |
          docker run --rm --network host \
            -e DATABASE_HOST=localhost \
            -e DATABASE_PORT=5432 \
            -e DATABASE_NAME=priorizai_db \
            -e DATABASE_USER=priorizai_user \
            -e DATABASE_PASSWORD=priorizai_password \
            priorizai-backend pytest

      - name: Build frontend image
        run: docker build -t priorizai-frontend ./frontend

      - name: Frontend lint
        run: docker run --rm priorizai-frontend npm run lint

      - name: Frontend build
        run: docker run --rm priorizai-frontend npm run build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: priorizai_backend
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
      - ./:/workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEBUG: ${DEBUG:-true}
      ADMIN_ALIAS: ${ADMIN_ALIAS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MODEL_SERVICE_URL: ${MODEL_SERVICE_URL:-}
      MODEL_SERVICE_TIMEOUT: ${MODEL_SERVICE_TIMEOUT:-300}
      MODEL_SERVICE_API_KEY: ${MODEL_SERVICE_API_KEY:-}
      MODEL_PATH: /workspace/models/priorizacion
      # Orden de las salidas del modelo (README, "Orden de las clases"). Sin
      # pasarla aca, definirla en el .env no tenia ningun efecto.
      MODEL_LABELS: ${MODEL_LABELS:-}
      NER_MODEL_PATH: /workspace/models/NER/modelo
      # Reentrenamiento: versiones nuevas en el disco del servidor, y el
      # modelo base de Hugging Face en cache para no bajarlo cada vez.
      MODELOS_VERSIONES_DIR: /workspace/models/versiones
      # Es ./models/versiones de este proyecto: asi se le muestra al usuario.
      MODELOS_VERSIONES_DIR_VISIBLE: models/versiones
      HF_HOME: /workspace/models/hf-cache
      REENTRENAMIENTO_MINIMO: ${REENTRENAMIENTO_MINIMO:-100}
      REENTRENAMIENTO_MODELO_BASE: ${REENTRENAMIENTO_MODELO_BASE:-PlanTL-GOB-ES/bsc-bio-ehr-es}

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: priorizai_frontend
      ports:
        - "3000:3000"
      volumes:
        - ./frontend:/app
        - /app/node_modules
        - /app/.next
      environment:
        API_URL: http://backend:8000
        WATCHPACK_POLLING: "true"
      depends_on:
        - backend

  postgres:
    image: postgres:16
    container_name: priorizai_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
